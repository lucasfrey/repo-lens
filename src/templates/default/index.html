<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{{REPO_NAME}} — RepoLens</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <header>
            <div class="container">
                <a class="logo" href="#">RepoLens</a>
                <span class="divider">/</span>
                <span class="repo-name">{{REPO_NAME}}</span>
                <span class="badge">{{PROJECT_TYPE}}</span>
            </div>
        </header>

        <main>
            <div class="container">
                <!-- Hero -->
                <h1 class="repo-title">{{README_TITLE}}</h1>
                <p class="repo-description">{{DESCRIPTION}}</p>
                <p class="intro-text">{{README_INTRO}}</p>

                <div class="grid">
                    <!-- Getting Started -->
                    <div class="card full-width">
                        <details open>
                            <summary class="card-header">
                                <span class="card-title">Getting Started</span>
                                <span class="toggle-icon">▼</span>
                            </summary>
                            <div class="card-body">
                                <pre id="install-block">{{README_INSTALL}}</pre>
                            </div>
                        </details>
                    </div>

                    <!-- Scripts -->
                    <div class="card">
                        <details open>
                            <summary class="card-header">
                                <span class="card-title">Scripts</span>
                                <span class="toggle-icon">▼</span>
                            </summary>
                            <div class="card-body">
                                <ul id="scripts-list">
                                    {{SCRIPTS}}
                                </ul>
                            </div>
                        </details>
                    </div>

                    <!-- Structure -->
                    <div class="card">
                        <details open>
                            <summary class="card-header">
                                <span class="card-title">Key Folders</span>
                                <span class="toggle-icon">▼</span>
                            </summary>
                            <div class="card-body">
                                <ul id="folders-list">
                                    {{IMPORTANT_FOLDERS}}
                                </ul>
                            </div>
                        </details>
                    </div>

                    <!-- Dependencies -->
                    <div class="card">
                        <details open>
                            <summary class="card-header">
                                <span class="card-title">Dependencies</span>
                                <span class="toggle-icon">▼</span>
                            </summary>
                            <div class="card-body">
                                <ul id="deps-list">
                                    {{DEPENDENCIES}}
                                </ul>
                            </div>
                        </details>
                    </div>
                </div>
            </div>
        </main>

        <footer>
            Generated by
            <a
                href="https://github.com/repo-lens/repo-lens"
                target="_blank"
                rel="noopener noreferrer"
                >RepoLens</a
            >
        </footer>

        <script>
            // Show placeholder text for empty sections
            document.querySelectorAll("ul").forEach((ul) => {
                if (!ul.children.length || ul.innerHTML.trim() === "") {
                    ul.innerHTML = '<li class="empty">None detected</li>';
                }
            });
            const installBlock = document.getElementById("install-block");
            if (installBlock && !installBlock.textContent.trim()) {
                installBlock.textContent =
                    "No install instructions found in README.";
                installBlock.style.color = "var(--text-muted)";
                installBlock.style.fontStyle = "italic";
            }

            // Animated collapsible details
            document.querySelectorAll("details").forEach((details) => {
                const summary = details.querySelector("summary");
                const body = details.querySelector(".card-body");
                if (!summary || !body) return;

                // Set initial max-height so transition has something to animate from
                body.style.maxHeight = details.open
                    ? body.scrollHeight + "px"
                    : "0px";
                body.style.opacity = details.open ? "1" : "0";

                summary.addEventListener("click", (e) => {
                    e.preventDefault();
                    if (details.open) {
                        // Closing: fix current height, then animate to 0
                        body.style.maxHeight = body.scrollHeight + "px";
                        requestAnimationFrame(() =>
                            requestAnimationFrame(() => {
                                body.style.maxHeight = "0px";
                                body.style.opacity = "0";
                            }),
                        );
                        body.addEventListener(
                            "transitionend",
                            () => details.removeAttribute("open"),
                            { once: true },
                        );
                    } else {
                        // Opening: set open first so content is renderable, then expand
                        details.setAttribute("open", "");
                        requestAnimationFrame(() => {
                            body.style.maxHeight = body.scrollHeight + "px";
                            body.style.opacity = "1";
                        });
                        body.addEventListener(
                            "transitionend",
                            () => (body.style.maxHeight = "none"),
                            { once: true },
                        );
                    }
                });
            });
        </script>
    </body>
</html>
