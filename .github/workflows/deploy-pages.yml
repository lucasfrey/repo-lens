name: Deploy to GitHub Pages

on:
    workflow_dispatch:
        inputs:
            repo:
                description: "GitHub repo to analyze (owner/repo)"
                required: true
                default: "storybookjs/storybook"
            template:
                description: "Template name or path"
                required: false
                default: "default"
    push:
        branches:
            - main

# Required for Pages deployment
permissions:
    contents: read
    pages: write
    id-token: write

# Only allow one concurrent deployment
concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    generate-and-deploy:
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: latest

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build repo-lens
              run: pnpm build

            - name: Generate site
              run: |
                  REPO="${{ github.event.inputs.repo || vars.TARGET_REPO }}"
                  if [ -z "$REPO" ]; then
                    echo "Error: No target repo set. Provide one via workflow_dispatch or set the TARGET_REPO repository variable."
                    exit 1
                  fi
                  node build/cli/index.js generate \
                    "$REPO" \
                    --out ./dist \
                    --template "${{ github.event.inputs.template || 'default' }}"
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: ./dist

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
